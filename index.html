<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#234d38"><title>Re:Grow · 내 손안의 고추 농사</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="#home">Re:Grow<span>고추 농사의 다음을, 함께</span></a><button id="fontOpen" class="textbtn" aria-label="글자 크기 설정">가<span>글자 크기</span></button></header><main id="app"></main><nav aria-label="주요 메뉴"><button data-tab="home">⌂<span>홈</span></button><button data-tab="calendar">▦<span>주간 기록</span></button><button data-tab="map">⌖<span>지역 지도</span></button><button data-tab="clinic">⊕<span>병해충</span></button><button data-tab="chat">✳<span>AI 상담</span></button><button data-tab="voices">☏<span>현장의 목소리</span></button></nav><dialog id="settings"><div class="dialoghead"><h2>읽기 편하게 설정하세요</h2><button data-close="settings" aria-label="닫기">✕</button></div><p>글자 크기를 바꾸면 모든 화면에 적용돼요.</p><div class="sizes"><button data-size="16">기본</button><button data-size="19">크게</button><button data-size="22">아주 크게</button></div><p class="muted">설정은 이 기기에 저장됩니다.</p></dialog><dialog id="farm"><div class="dialoghead"><h2>내 농장 설정</h2><button data-close="farm" aria-label="닫기">✕</button></div><form id="farmForm"><label for="region">농사짓는 지역</label><div class="region-autocomplete"><input id="region" role="combobox" aria-expanded="false" aria-controls="suggestions" autocomplete="off" placeholder="예: 밀양, 영양, 양평"><div id="suggestions" role="listbox"></div></div><label for="env">재배 환경</label><select id="env"><option>노지</option><option>비가림</option><option>시설하우스</option></select><label for="stage">현재 재배 단계</label><select id="stage"><option>파종 준비</option><option>육묘 중</option><option>정식 준비</option><option>정식 후</option><option>수확 중</option></select><label for="plantDate">파종일 <small>(선택)</small></label><input type="date" id="plantDate"><button class="primary full">내 농장으로 보기</button></form></dialog><div id="toast" role="status"></div><script src="regions.js"></script><script src="app.js"></script></body></html>
