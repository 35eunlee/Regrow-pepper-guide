<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#234d38"><title>Re:Grow · 내 손안의 고추 농사</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><link rel="stylesheet" href="style.css?v=20261116-materials"><link rel="stylesheet" href="pilot.css?v=20261116-materials"><link rel="stylesheet" href="workflow.css?v=20261116-materials"></head><body><header><a class="brand" href="#home">Re:Grow<span>고추 농사의 다음을, 함께</span></a><button id="fontOpen" class="textbtn" aria-label="글자 크기 설정">가<span>글자 크기</span></button></header><main id="app"></main><nav aria-label="주요 메뉴"><button data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg><span>홈</span></button><button data-tab="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg><span>주간 기록</span></button><button data-tab="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8 8 0 0 1-3.5-.8L4 20l1.4-3.4A7 7 0 0 1 4 12c0-4.2 3.6-7.5 8-7.5s8 3.1 8 7Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg><span>AI 상담</span></button><button data-tab="voices"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10v2M12 8v6M16 10v2"/></svg><span>농부 이야기</span></button></nav><dialog id="settings"><div class="dialoghead"><h2>읽기 편하게 설정하세요</h2><button data-close="settings" aria-label="닫기">✕</button></div><p>글자 크기를 바꾸면 모든 화면에 적용돼요.</p><div class="sizes"><button data-size="16">기본</button><button data-size="19">크게</button><button data-size="22">아주 크게</button></div><p class="muted">설정은 이 기기에 저장됩니다.</p></dialog><dialog id="farm"><div class="dialoghead"><h2>내 농장
